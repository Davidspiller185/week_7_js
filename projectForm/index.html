<form action="http://localhost:3000/contact" method="post">
    <label for="name">
        שם מלא
    </label>
    <input
          type="text"
          id="name"
          name="name"
          required
    >
    <label for="email">
        אימייל
    </label>
    <input 
            type="text"
            id="email"
            name="email"
            required
    >
    <label for="subject">
        נושא
    </label>
    <select name="subject" id="subject">
        <option value="bug">
            תקלה
        </option>
        <option value="feature">
            פיצ'ר
        </option>
        <option value="question">
            שאלה
        </option>
        <option value="other">
            אחר
        </option>
    </select>
    <label for="message">
        מסר
    </label>
    <textarea
        id="message"
        name="message"
        minlength="10"
        required
    ></textarea>
    <button type="submit">
        שלח פנייה
    </button>
</form>
