<form action="http://localhost:3000/register" method="post">
    <label for="fullname">
        שם מלא
    </label>
    <input 
          type="text"
          id="fullname"
          name="name"
          required
          minlength="2"
    >
    <label for="email">
        אימייל
    </label>
    <input
          type="email"
          id="email"
          name="email"
          required
    >
    <label for="password">
        סיסמה
    </label>
    <input 
          type="password"
          id="password"
          name="password"
          required
          minlength="8"
    >
    <label for="age">
        גיל
    </label>
    <input 
          type="number"
          id="age"
          name="age"
          min="13"
          max="120"
    >
    <label for="role">
        תפקיד
    </label>
    <select name="role" id="role">
        <option value="user">
            משתמש
        </option>
        <option value="admin">
            מנהל
        </option>
    </select>
    <label for="checkbox">
        הסכמה לתנאים
    </label>
    <input 
           type="checkbox"
           id="checkbox"
           name="agree"
           value="yes"
           required
    >
    <button type="submit">
        הרשמה
    </button>

</form>
